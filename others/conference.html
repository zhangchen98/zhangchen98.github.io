<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Chen Zhang's Homepage — Conference Calendar</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@700;1,700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #ffffff;
      color: #222;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* 导航栏样式 */
    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      padding: 15px 0;
      position: sticky;
      top: 0;
      z-index: 999;
      max-width: 1200px;
      margin: 0 auto;
      border-radius: 12px;
    }

    nav a {
      margin: 0 20px;
      font-size: 22px;
      font-weight: bold;
      color: #000000;
      text-decoration: none;
      padding-bottom: 5px;
      transition: color 0.3s;
    }

    nav a.active {
      color: #01497c;
      border-bottom: 2px solid #01497c;
    }

    nav a:hover {
      color: #01497c;
      text-decoration: none;
      border-bottom: none;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, select, button {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      background: #f8f8f8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 10px 8px;
      border: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f2f5f8;
      font-weight: 600;
      cursor: pointer;
    }

    tr:hover td {
      background: #fafafa;
    }

    .year-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 8px 16px;
      border-radius: 8px;
      background: #f0f0f0;
      cursor: pointer;
      font-weight: 500;
    }

    .tab.active {
      background: #01497c;
      color: #fff;
    }

    .foot {
      margin-top: 15px;
      color: #777;
      font-size: 13px;
      text-align: center;
    }

    /* 时间线动画样式 */
    .timeline-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 10px;
    }

    .timeline-container h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .timeline {
      position: relative;
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding: 20px 10px;
      background: #f9f9f9;
      border-radius: 12px;
      border: 1px solid #eee;
      scroll-behavior: smooth;
    }

    .timeline::-webkit-scrollbar {
      height: 8px;
    }

    .timeline::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }

    .timeline-item {
      flex: 0 0 auto;
      background: #fff;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 12px 16px;
      text-align: center;
      min-width: 160px;
      transition: transform 0.3s, border-color 0.3s, background 0.3s;
    }

    .timeline-item.upcoming {
      border-color: #01497c;
      background: #e6f0fa;
      font-weight: bold;
    }

    .timeline-item:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AI/ML/RO Conference Calendar — 2024 to Now</h1>
    <p class="subtitle">Last updated: 2026/08/12</p>

    <!-- 时间线动画 -->
    <div class="timeline-container">
      <h2>Upcoming Conference Submission Deadline</h2>
      <div class="timeline" id="timeline"></div>
    </div>

    <div class="controls">
      <input id="search" placeholder="Filter by name (e.g. CVPR)">
      <select id="viewMode">
        <option value="year">Show single year</option>
        <option value="all">Show all years</option>
      </select>
      <button id="sortSubmit">Sort by submission date ↑</button>
    </div>

    <div class="year-tabs">
      <div class="tab active" data-year="2027">2027</div>
      <div class="tab" data-year="2026">2026</div>
      <div class="tab" data-year="2025">2025</div>
      <div class="tab" data-year="2024">2024</div>
    </div>

    <div id="tables"></div>

    <div class="foot">
    Sort or filter to explore major conference timelines.<br>
    👀 Total Visits: <span id="busuanzi_value_site_pv"></span> |
    👤 Visitors: <span id="busuanzi_value_site_uv"></span>
</div>
  </div>

  <script>
    // 数据
    const data = {
      "2027": [
        {name:"CVPR", submit:"xxx", rebuttal:"xxx", notify:"xxx", conf:"2027-06-20~2027-06-24", site:"Seattle, Washington, United States"},
        {name:"AAAI", submit:"2026-07-28", rebuttal:"2025-10-19~2025-10-25", notify:"phase 1: 2025-09-24; final: 2025-11-30", conf:"2027-02-16~2027-02-23", site:"Montréal, Canada"},
        {name:"ICRA", submit:"2026-09-15", rebuttal:"no", notify:"-", conf:"2027-05-24~2027-05-28", site:"Seoul, South Korea"},
        {name:"ICLR", submit:"2026-09-25", rebuttal:"2026-11-05~2026-11-18", notify:"2026-12-16", conf:"2027-04-26~2027-04-30", site:" California, United States"},
      ],
      "2026": [
        {name:"CVPR", submit:"2025-11-13", rebuttal:"2026-01-22~2026-01-29", notify:"2026-02-20", conf:"2026-06-03~2026-06-07", site:"Denver, Colorado, United States"},
        {name:"ECCV", submit:"2026-03-05", rebuttal:"2026-05-02~2026-05-11", notify:"2026-06-17", conf:"2026-09-08~2026-09-13", site:"Malmö, Sweden"},
        {name:"NeurIPS", submit:"2026-05-06", rebuttal:"2026-07-22~2026-08-03", notify:"2026-09-24", conf:"2026-12-06~2026-12-12", site:"Sydney, Australia"},
        {name:"ICLR", submit:"2025-09-24", rebuttal:"2025-11-11~2025-11-27", notify:"2026-01-22", conf:"2026-04-23~2026-04-27", site:"Rio de Janeiro, Brazil"},
        {name:"ICML", submit:"2026-01-28", rebuttal:"2026-03-24~2026-03-30", notify:"2026-04-30", conf:"2026-07-06~2026-07-11", site:"Seoul, South Korea"},
        {name:"AAAI", submit:"2025-08-01", rebuttal:"2025-10-02~2025-10-08", notify:"phase 1: 2025-09-12; final: 2025-11-08", conf:"2026-01-20~2026-01-27", site:"Singapore"},
        {name:"IJCAI", submit:"2026-01-19", rebuttal:"2026-04-07~2026-04-10", notify:"phase 1: 2026-03-04; final: 2026-04-29", conf:"2026-08-15~2026-08-21", site:"Bremen, Germany"},
        {name:"ACM MM", submit:"2026-04-01", rebuttal:"2026-05-xx~2026-06-04", notify:"2026-07-09", conf:"2026-11-10~2026-11-14", site:"Rio de Janeiro, Brazil"},
        {name:"CoRL", submit:"2026-05-28", rebuttal:"2026-08-04~2026-08-11", notify:"2026-09-04", conf:"2026-11-09~2026-11-12", site:"Austin, Texas, United States"},
        {name:"RSS", submit:"2026-01-30", rebuttal:"2026-03-27~2026-04-03", notify:"2026-04-27", conf:"2026-07-13~2026-07-17", site:"Sydney, Australia"},
        {name:"ICRA", submit:"2025-09-15", rebuttal:"no", notify:"2026-01-31", conf:"2026-06-01~2026-06-05", site:"Vienna, Austria"},
        {name:"IROS", submit:"2026-03-02", rebuttal:"no", notify:"2026-06-16", conf:"2026-9-27~2026-10-01", site:"Pittsburgh, PA, United States"}
      ],
      "2025": [
        {name:"CVPR", submit:"2024-11-15", rebuttal:"2025-01-23~2025-01-30", notify:"2025-02-26", conf:"2025-06-11~2025-06-15", site:"Nashville, Tennessee, United States"},
        {name:"ICCV", submit:"2025-03-07", rebuttal:"2025-05-09~2025-05-16", notify:"2025-06-20", conf:"2025-10-19~2025-10-23", site:"Honolulu, Hawaii, United States"},
        {name:"NeurIPS", submit:"2025-05-15", rebuttal:"2025-07-24~2025-08-06", notify:"2025-09-18", conf:"2025-12-02~2025-12-07", site:"San Diego, California, United States"},
        {name:"ICML", submit:"2025-01-30", rebuttal:"2025-03-25~2025-04-08", notify:"2025-05-01", conf:"2025-07-13~2025-07-19", site:"Vancouver, British Columbia, Canada"},
        {name:"ICLR", submit:"2024-10-01", rebuttal:"2024-11-13~2024-11-27", notify:"2025-01-22", conf:"2025-04-24~2025-04-28", site:"Singapore"},
        {name:"AAAI", submit:"2024-08-15", rebuttal:"2024-11-04~2024-11-08", notify:"phase 1: 2024-10-14; final: 2024-12-09", conf:"2025-02-27~2025-03-04", site:"Philadelphia, Pennsylvania, United States"},
        {name:"IJCAI", submit:"2025-01-23", rebuttal:"2025-04-06~2025-04-09", notify:"phase 1: 2025-03-07; final: 2025-04-28", conf:"2025-08-16~2025-08-22", site:"Montreal, Quebec, Canada"},
        {name:"ACM MM", submit:"2025-04-11", rebuttal:"2025-06-09~2025-06-16", notify:"2025-07-04", conf:"2025-10-27~2025-10-31", site:"Dublin, Ireland"},
        {name:"CoRL", submit:"2025-04-30", rebuttal:"2025-06-25~2025-07-02", notify:"2025-08-01", conf:"2025-09-27~2025-09-30", site:"Seoul, South Korea"},
        {name:"RSS", submit:"2025-01-24", rebuttal:"2025-03-17~2025-03-24", notify:"2025-04-10", conf:"2025-07-15~2025-07-19", site:"Los Angeles, California, United States"},
        {name:"ICRA", submit:"2024-09-15", rebuttal:"no", notify:"2025-01-31", conf:"2025-05-19~2025-05-23", site:"Atlanta, Georgia, United States"},
        {name:"IROS", submit:"2025-03-02", rebuttal:"no", notify:"2025-06-30", conf:"2025-10-19~2025-10-25", site:"Hangzhou, Zhejiang, China"}
      ],
      "2024": [
        {name:"CVPR", submit:"2023-11-18", rebuttal:"2024-01-24~2024-01-31", notify:"2024-02-27", conf:"2024-06-17~2024-06-21", site:"Seattle, Washington, United States"},
        {name:"ECCV", submit:"2024-03-07", rebuttal:"2024-05-09~2024-05-17", notify:"2024-07-01", conf:"2024-09-29~2024-10-04", site:"Milan, Italy"},
        {name:"NeurIPS", submit:"2024-05-22", rebuttal:"2024-07-30~2024-08-06", notify:"2024-09-26", conf:"2024-12-09~2024-12-15", site:"Vancouver, British Columbia, Canada"},
        {name:"ICML", submit:"2024-02-01", rebuttal:"2024-03-20~2024-03-28", notify:"2024-05-01", conf:"2024-07-21~2024-07-27", site:"Vienna, Austria"},
        {name:"ICLR", submit:"2023-09-28", rebuttal:"2023-11-10~2023-11-22", notify:"2024-01-15", conf:"2024-05-07~2024-05-11", site:"Vienna, Austria"},
        {name:"AAAI", submit:"2023-08-15", rebuttal:"2023-11-02~2023-11-07", notify:"phase 1: 2023-09-27; final: 2023-12-09", conf:"2024-02-20~2024-02-27", site:"Vancouver, British Columbia, Canada"},
        {name:"IJCAI", submit:"2024-01-17", rebuttal:"2024-03-18~2024-03-21", notify:"phase 1: 2024-02-22; final: 2024-04-16", conf:"2024-08-03~2024-08-09", site:"Jeju Island, South Korea"},
        {name:"ACM MM", submit:"2024-04-12", rebuttal:"2024-06-10~2024-06-17", notify:"2024-07-15", conf:"2024-10-28~2024-11-01", site:"Melbourne, Victoria, Australia"},
        {name:"CoRL", submit:"2024-06-06", rebuttal:"2024-08-02~2024-08-13", notify:"2024-09-04", conf:"2024-11-06~2024-11-09", site:"Munich, Germany"},
        {name:"RSS", submit:"2024-02-02", rebuttal:"2024-03-29~2024-04-19", notify:"2024-05-13", conf:"2024-07-15~2024-07-19", site:"Delft, Netherlands"},
        {name:"ICRA", submit:"2023-09-15", rebuttal:"no", notify:"2024-01-31", conf:"2024-05-13~2024-05-17", site:"Yokohama, Japan"},
        {name:"IROS", submit:"2024-03-01", rebuttal:"no", notify:"2024-06-30", conf:"2024-10-14~2024-10-18", site:"Abu Dhabi, United Arab Emirates"}
      ]
    };

    // ---------- 时间线动画 ----------
    const today = new Date();
    const timelineDiv = document.getElementById('timeline');
    const futureConfs = [];
    for (const year of Object.keys(data).sort()) {
      for (const conf of data[year]) {
        if (!conf.submit) continue;
        const submitDate = new Date(conf.submit);
        if (submitDate >= today) {
          futureConfs.push({
            name: conf.name,
            submit: conf.submit,
            year: year
          });
        }
      }
    }
    futureConfs.sort((a, b) => new Date(a.submit) - new Date(b.submit));
    futureConfs.forEach(conf => {
      const item = document.createElement('div');
      item.className = 'timeline-item upcoming';
      item.innerHTML = `<div>${conf.name}</div><div style="font-size:12px;color:#555;">Submit by: ${conf.submit}</div>`;
      timelineDiv.appendChild(item);
    });

     scrollPos = 0;
     scrollDirection = 1;
    function animateTimeline() {
      const maxScroll = timelineDiv.scrollWidth - timelineDiv.clientWidth;
      scrollPos += scrollDirection * 0.5;
      if (scrollPos >= maxScroll || scrollPos <= 0) scrollDirection *= -1;
      timelineDiv.scrollLeft = scrollPos;
      requestAnimationFrame(animateTimeline);
    }
    animateTimeline();

    // ---------- 表格渲染 ----------
    let currentYear = '2027';
    let currentView = 'year';
    let currentSearch = '';
    let sortAsc = true;

    function buildTable(year){
      const rows = data[year] || [];
      let html = '<table><thead><tr><th>Name</th><th>Submission</th><th>Rebuttal</th><th>Notification</th><th>Conference Time</th><th>Conference Site</th></tr></thead><tbody>';
      for(const r of rows){
        html += `<tr><td>${r.name}</td><td>${r.submit}</td><td>${r.rebuttal}</td><td>${r.notify}</td><td>${r.conf}</td><td>${r.site || '-'}</tr>`;
      }
      html += '</tbody></table>';
      return html;
    }

    const tablesDiv = document.getElementById('tables');

    function applyFilter() {
      const q = currentSearch.trim().toLowerCase();
      document.querySelectorAll('#tables tbody tr').forEach(tr => {
        tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none';
      });
    }

    function renderYear(y){
      currentYear = y;
      currentView = 'year';
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.year === y));
      tablesDiv.innerHTML = buildTable(y);
      applyFilter();
    }

    function renderAll(){
      currentView = 'all';
      let combined = '';
      for(const y of Object.keys(data).sort().reverse()) combined += `<h3 style="margin-top:10px">${y}</h3>` + buildTable(y);
      tablesDiv.innerHTML = combined;
      applyFilter();
    }

    renderYear(currentYear);

    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', e => {
      renderYear(t.dataset.year);
      document.getElementById('viewMode').value = 'year';
    }));

    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', e => {
      currentSearch = e.target.value;
      applyFilter();
    });

    document.getElementById('viewMode').addEventListener('change', e => {
      if(e.target.value === 'all') {
        renderAll();
      } else {
        renderYear();
      }
    });

    document.getElementById('sortSubmit').addEventListener('click', () => {
      if(currentView === 'all'){
        for(const y of Object.keys(data)){
          data[y].sort((a,b) => {
            const da = a.submit ? new Date(a.submit) : new Date('2100-01-01');
            const db = b.submit ? new Date(b.submit) : new Date('2100-01-01');
            return sortAsc ? da - db : db - da;
          });
        }
        renderAll();
      } else {
        data[].sort((a,b) => {
          const da = a.submit ? new Date(a.submit) : new Date('2100-01-01');
          const db = b.submit ? new Date(b.submit) : new Date('2100-01-01');
          return sortAsc ? da - db : db - da;
        });
        renderYear();
      }
      sortAsc = !sortAsc;
      document.getElementById('sortSubmit').innerText = `Sort by submission date ${sortAsc ? '↑':'↓'}`;
    });
  </script>
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>

</html>
