<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Chen Zhang's Homepage</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', serif; }
    body { background: #f9f9f9; color: #333; padding: 40px 20px; }

    /* 导航栏 */
    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      padding: 15px 0;
      position: sticky;
      top: 0;
      z-index: 999;
      max-width: 1200px;
      margin: 0 auto 40px;
      border-radius: 12px;
    }
    nav a {
      margin: 0 20px;
      font-size: 22px;
      font-weight: 700;
      color: #000;
      padding-bottom: 5px;
      text-decoration: none;
    }
    nav a.active { color: #01497c; border-bottom: 2px solid #01497c; text-decoration: none; }
    nav a:hover { color: #01497c; border-bottom: none; text-decoration: none; }

    /* 页面容器 */
    .container { max-width: 1200px; margin: 0 auto; }

    /* 卡片网格：每行2列 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      color: #000;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
      flex: 1;
      text-align: center;
    }

    .card-content h3 {
      font-size: 20px;
      font-weight: 700;
    }

    /* 响应式：手机端每行1个 */
    @media (max-width: 768px) {
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Navigation bar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="profile.html">Profile</a>
    <a href="publications.html">Publications</a>
    <a href="others.html"  class="active">Others</a>
  </nav>

  <!-- Content container -->
  <main class="container">
    <section id="cards-section">
      <div class="card-grid" id="cardGrid"></div>
    </section>
  </main>

  <script>
    const cardsData = [
      {title:"Timeline of Conferences", img:"assets/images/timeline.png", link:"others/conference.html"},
      // 继续添加更多卡片...
    ];

    function renderCards(){
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';
      cardsData.forEach(card=>{
        const a = document.createElement('a');
        a.href = card.link;
        a.className = 'card';
        a.target = "_blank"; // 可选：在新标签页打开
        a.innerHTML = `
          <img src="${card.img}" alt="${card.title}">
          <div class="card-content">
            <h3>${card.title}</h3>
          </div>`;
        grid.appendChild(a);
      });
    }

    renderCards();
  </script>
</body>
</html>
